<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: height: 100vh; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center">
    <div class="card login-card p-4 bg-white">
        <h3 class="text-center mb-4 text-primary">Вход в депо</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2" role="alert">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Логин</label>
                <input type="text" class="form-control" name="username" placeholder="Введите логин" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Пароль</label>
                <input type="password" class="form-control" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none text-muted small">← На главную страницу</a>
        </div>
    </div>
</div>

</body>
</html>
